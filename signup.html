<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顺通驾校 · 我要报名</title>
<meta name="theme-color" content="#38a3f5">

<!-- ===================================================================
     兜底样式（故意放在 style.css 之前）
     作用：万一 style.css 因为缓存 / 路径 / 网络原因没加载出来，
     这个页面依然有排版、能看到表单、能点能提交，绝不会白屏。
     正常加载时，下面的 style.css 会把这些规则全部覆盖掉。
     =================================================================== -->
<style>
body{margin:0;background:#f2f8ff;color:#22303f;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;line-height:1.7}
.phone{background:#f6fafe}
.topbar{background:#0d8be0;color:#fff;text-align:center}
.content{padding:18px 16px}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px}
label{display:block;margin:14px 0 6px;font-size:13px;color:#8494a5}
input,select,textarea{width:100%;box-sizing:border-box;height:42px;padding:0 12px;border:1px solid #dbe7f3;border-radius:10px;font-family:inherit;font-size:14px}
textarea{height:90px;padding:10px 12px}
.btn{display:block;width:100%;box-sizing:border-box;height:44px;margin-top:18px;border:0;border-radius:12px;background:#0d8be0;color:#fff;font-size:15px;font-weight:600;line-height:44px;text-align:center;text-decoration:none;cursor:pointer}
.hidden{display:none!important}
.tip{font-size:13px;color:#8494a5}
.done-box{text-align:center;padding:20px}
</style>

<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<div class="phone">
  <header class="topbar"><a class="back" href="index.html">‹</a>我要报名</header>

  <main class="content content-full">

    <!-- ============ 视图一：报名表单 ============ -->
    <section id="view-form">
      <p class="tip">填写下面 3 项，客服会在 1 小时内联系你确认</p>

      <div class="card">
        <label>姓名 <i>*</i></label>
        <input type="text" id="s-name" placeholder="请输入你的姓名" maxlength="20">

        <label>手机号 <i>*</i></label>
        <input type="tel" id="s-phone" placeholder="请输入 11 位手机号" maxlength="11">

        <label>意向班型 <i>*</i></label>
        <select id="s-plan">
          <option value="">请选择班型</option>
          <option value="C1 手动挡">C1 手动挡 ¥3800 起</option>
          <option value="C2 自动挡">C2 自动挡 ¥4200 起</option>
        </select>

        <label>备注（选填）</label>
        <textarea id="s-remark" rows="3" placeholder="比如：想周末练车 / 需要班车接送"></textarea>

        <button class="btn" id="btn-submit" type="button">提交报名</button>
      </div>

      <div class="card">
        <h4>报名需要准备</h4>
        <p>身份证原件及复印件 2 份 ｜ 一寸白底照片 8 张 ｜ 体检表（可到校免费体检）</p>
      </div>
    </section>

    <!-- ============ 视图二：报名成功 ============ -->
    <section id="view-done" class="hidden">
      <div class="done-box">
        <div class="done-ico">✅</div>
        <h2>报名成功</h2>
        <p>客服将在 1 小时内与你联系，请保持手机畅通</p>
      </div>

      <div class="card signup-sum">
        <h4>报名信息概要</h4>
        <div class="row"><span class="row-t">姓名</span><span class="row-v" id="d-name"></span></div>
        <div class="row"><span class="row-t">手机号</span><span class="row-v" id="d-phone"></span></div>
        <div class="row"><span class="row-t">意向班型</span><span class="row-v" id="d-plan"></span></div>
        <div class="row"><span class="row-t">备注</span><span class="row-v" id="d-remark"></span></div>
        <div class="row"><span class="row-t">提交时间</span><span class="row-v" id="d-time"></span></div>
      </div>

      <a class="btn" href="index.html#mine">查看我的报名</a>
      <a class="btn btn-ghost" href="index.html">返回首页</a>
    </section>

  </main>

  <!-- 提示条（和首页同一套样式） -->
  <div id="toast" class="toast"></div>
</div>

<script>
/* ===================================================================
   「我要报名」模块：纯前端 + LocalStorage，不依赖任何框架
   所有本地存储读写都做了安全兜底，任何异常都不会让页面崩溃
   =================================================================== */
var SIGNUP_KEY = 'signups';

/* ---------- 安全工具 ---------- */
function $(id) { return document.getElementById(id); }              // 取不到就返回 null

function val(id) {                                                  // 取输入框的值，取不到给空串
  var el = $(id);
  return el && typeof el.value === 'string' ? el.value.trim() : '';
}

function readSignups() {                                            // 安全读取报名列表
  try {
    var raw = localStorage.getItem(SIGNUP_KEY);
    var data = raw ? JSON.parse(raw) : [];                          // JSON.parse(...) || []
    return Array.isArray(data) ? data : [];                         // 不是数组也兜底成空数组
  } catch (e) {
    return [];                                                      // 存储被禁用 / 数据损坏 → 空数组
  }
}

function saveSignups(list) {                                        // 安全写入，写不进去也不报错
  try {
    localStorage.setItem(SIGNUP_KEY, JSON.stringify(list));
  } catch (e) { /* 隐私模式 / 存储已满：忽略即可 */ }
}

/* ---------- 提示条 ---------- */
var tipTimer;
function showToast(msg) {
  var t = $('toast');
  if (!t) { return; }
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;                                               // 强制重排，让动画能重复播放
  t.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(function () { t.classList.remove('show'); }, 1900);
}

/* ---------- 时间格式：2025-06-12 15:30 ---------- */
function nowText() {
  var d = new Date();
  var p = function (n) { return n < 10 ? '0' + n : n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- 提交报名：先判断非空，再存本地 ---------- */
function submitSignup() {
  try {
    var name = val('s-name');
    var phone = val('s-phone');
    var plan = val('s-plan');
    var remark = val('s-remark') || '无';

    if (!name) { showToast('请填写姓名'); return; }
    if (!phone) { showToast('请填写手机号'); return; }
    if (!/^1\d{10}$/.test(phone)) { showToast('手机号请填 11 位数字'); return; }
    if (!plan) { showToast('请选择意向班型'); return; }

    var one = {
      name: name,
      phone: phone,
      plan: plan,
      remark: remark,
      time: nowText(),
      status: '待联系'
    };

    var list = readSignups();                                      // ← 安全读取，永不抛错
    list.push(one);
    saveSignups(list);

    fillDone(one);                                                 // 把信息填到成功页

    var formView = $('view-form');
    var doneView = $('view-done');
    if (formView && doneView) {
      formView.classList.add('hidden');
      doneView.classList.remove('hidden');
    }
    window.scrollTo(0, 0);
    showToast('报名成功');
  } catch (e) {
    showToast('提交失败，请刷新页面重试');                          // 兜底：任何异常都给用户提示
  }
}

/* ---------- 报名成功页：显示信息概要 ---------- */
function fillDone(o) {
  var map = {
    'd-name': o.name,
    'd-phone': o.phone,
    'd-plan': o.plan,
    'd-remark': o.remark,
    'd-time': o.time
  };
  for (var id in map) {
    var el = $(id);
    if (el) { el.textContent = map[id] || ''; }
  }
}

/* ---------- 绑定按钮（不写在 HTML 里，避免任何加载顺序问题） ---------- */
(function init() {
  var btn = $('btn-submit');
  if (btn) { btn.addEventListener('click', submitSignup); }

  // 兜底：万一 URL 带了 ?done=1，直接展示成功页（方便单独调试这个视图）
  try {
    if (location.search.indexOf('done=1') > -1) {
      var f = $('view-form'), d = $('view-done');
      if (f && d) { f.classList.add('hidden'); d.classList.remove('hidden'); }
    }
  } catch (e) { /* 忽略 */ }
})();
</script>
</body>
</html>
